name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  zig-parquet:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        zig: [0.16.0, 0.17.0]
    runs-on: ${{ matrix.os }}
    name: zig-parquet (${{ matrix.os }}, zig ${{ matrix.zig }})

    steps:
      - uses: actions/checkout@v5

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ matrix.zig }}

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Generate test files
        working-directory: test-files-arrow
        run: uv run python generate.py

      - name: Build library
        working-directory: zig-parquet
        run: zig build

      - name: Run tests
        working-directory: zig-parquet
        run: zig build test

      - name: WASM smoke test
        working-directory: zig-parquet
        run: zig build wasm-smoke

      - name: Build examples
        run: |
          cd zig-parquet/examples/basic && zig build
          cd ../../examples/large_file && zig build
          cd ../../examples/gen-power-grid && zig build
          cd ../../examples/wasm_demo && zig build
          cd ../../examples/wasm_freestanding && zig build

      - name: Run freestanding WASM example
        working-directory: zig-parquet/examples/wasm_freestanding
        run: deno run --allow-read host/example.ts ${{ github.workspace }}/test-files-arrow/basic/basic_types_plain_uncompressed.parquet

      - name: Check interop artifacts are up to date
        run: git diff --exit-code test-files-arrow/interop/

  c-codecs:
    strategy:
      matrix:
        zig: [0.16.0, 0.17.0]
    runs-on: ubuntu-latest
    name: c-codecs (zig ${{ matrix.zig }})

    steps:
      - uses: actions/checkout@v5

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ matrix.zig }}

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false

      - name: Generate test files
        working-directory: test-files-arrow
        run: uv run python generate.py

      - name: Run tests with C codecs only
        working-directory: zig-parquet
        run: zig build test -Dcodecs=c-only

  fmt:
    runs-on: ubuntu-latest
    name: fmt (zig 0.16.0)

    steps:
      - uses: actions/checkout@v5

      - uses: mlugg/setup-zig@v2
        with:
          # 0.17's fmt emits 0.17-only builtins; formatting is 0.16-only (see AGENTS.md)
          version: 0.16.0

      - name: Check formatting
        run: zig fmt --check zig-parquet/src zig-parquet/build.zig zig-parquet/bench zig-parquet/fuzz cli/src cli/build.zig

  interop:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false

      - name: Run interop tests
        working-directory: test-files-arrow
        run: uv run pytest test_interop.py -v

  pqi:
    needs: zig-parquet
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        zig: [0.16.0, 0.17.0]
    runs-on: ${{ matrix.os }}
    name: pqi (${{ matrix.os }}, zig ${{ matrix.zig }})

    steps:
      - uses: actions/checkout@v5

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ matrix.zig }}

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false

      - name: Generate test files
        working-directory: test-files-arrow
        run: uv run python generate.py

      - name: Build pqi
        working-directory: cli
        run: zig build

      - name: Run tests
        working-directory: cli
        run: zig build test

      - name: Validate wild test files
        working-directory: cli
        run: ./validate-wild.sh
